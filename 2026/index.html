<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Бруд Пес — Розклад 2025</title>
  <style>
    @font-face {
      font-family: 'PP Pangram Sans';
      src: url('../2025/PPPangramSans-Semibold.otf') format('opentype');
      font-weight: 600;
    }
    @font-face {
      font-family: 'PP Pangram Sans';
      src: url('../2025/PPPangramSans-Bold.otf') format('opentype');
      font-weight: 700;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: 'PP Pangram Sans', Arial, sans-serif;
      background: #000;
      color: #fff;
    }

    .bg {
      min-height: 100vh;
      background:
        linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55)),
        url('brudpes-festival-atmosphere.webp') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px 60px;
      gap: 24px;
    }

    h1 {
      font-weight: 700;
      font-size: clamp(1.4em, 6vw, 2.4em);
      letter-spacing: 0.1em;
      text-align: center;
      margin: 0;
      text-transform: uppercase;
    }

    /* ── Day buttons ── */
    .day-buttons {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .day-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      background: #f5d800;
      color: #000;
      font-weight: 700;
      font-size: clamp(1em, 4vw, 1.3em);
      padding: 14px 32px;
      letter-spacing: 0.08em;
      transition: background 0.2s, color 0.2s;
    }

    .day-btn span {
      font-size: 0.55em;
      font-weight: 600;
      letter-spacing: 0.12em;
      margin-top: 2px;
      opacity: 0.75;
    }

    .day-btn:hover {
      background: #fff;
    }

    /* ── Collapsible blocks ── */
    .collapse-block {
      width: 100%;
      max-width: 480px;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(0,0,0,0.45);
    }

    .collapse-title {
      font-weight: 700;
      font-size: 0.85em;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 12px 16px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    .collapse-title::after {
      content: '▾';
      transition: transform 0.3s;
    }

    .collapse-block.open .collapse-title::after {
      transform: rotate(180deg);
    }

    .collapse-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s ease;
    }

    .collapse-block.open .collapse-content {
      max-height: 2000px;
    }

    /* ── Hint content ── */
    .hint-inner {
      font-size: 0.82em;
      line-height: 1.6;
      padding: 0 16px 14px;
      color: rgba(255,255,255,0.85);
    }

    .hint-inner ul {
      margin: 0;
      padding-left: 18px;
    }

    .hint-inner li {
      margin-bottom: 6px;
    }

    /* ── Map content ── */
    .map-inner img {
      width: 100%;
      display: block;
    }

    /* ── Favourites button ── */
    .fav-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      background: none;
      border: 1px solid rgba(255,255,255,0.35);
      color: #fff;
      font-family: 'PP Pangram Sans', Arial, sans-serif;
      font-weight: 700;
      font-size: clamp(0.85em, 3.5vw, 1.1em);
      letter-spacing: 0.08em;
      padding: 14px 28px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .fav-btn:hover { border-color: #fff; background: rgba(255,255,255,0.1); }
    .fav-btn svg { width: 24px; height: 24px; fill: #f5d800; flex-shrink: 0; }
    .fav-count {
      background: #f5d800;
      color: #000;
      font-size: 1em;
      font-weight: 700;
      border-radius: 50%;
      min-width: 26px;
      height: 26px;
      padding: 0 4px;
      display: none;
      align-items: center;
      justify-content: center;
      line-height: 26px;
    }
    .fav-count.visible { display: flex; }

    /* ── Favourites modal ── */
    .fav-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 100;
      align-items: flex-end;
      justify-content: center;
    }
    .fav-overlay.open { display: flex; }
    .fav-modal {
      background: #111;
      width: 100%;
      max-width: 480px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      border-top: 2px solid #f5d800;
    }
    .fav-modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.12);
    }
    .fav-modal-title {
      font-weight: 700;
      font-size: 0.9em;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .fav-close {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.4em;
      cursor: pointer;
      line-height: 1;
      padding: 0 4px;
    }
    .fav-list {
      overflow-y: auto;
      padding: 12px 0;
    }
    .fav-empty {
      padding: 32px 20px;
      color: rgba(255,255,255,0.45);
      font-size: 0.85em;
      letter-spacing: 0.05em;
      text-align: center;
    }
    .fav-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      gap: 12px;
    }
    .fav-item-left { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .fav-item-name {
      font-weight: 700;
      font-size: 0.9em;
      letter-spacing: 0.06em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .fav-item-meta {
      font-size: 0.72em;
      letter-spacing: 0.08em;
      color: rgba(255,255,255,0.5);
    }
    .fav-item-right { flex-shrink: 0; text-align: right; }
    .fav-item-time {
      font-weight: 700;
      font-size: 0.9em;
      letter-spacing: 0.06em;
    }
    .fav-item-countdown {
      font-size: 0.72em;
      letter-spacing: 0.06em;
      color: #f5d800;
      margin-top: 2px;
    }

    /* ── Footer ── */
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      padding: 12px;
      background: linear-gradient(transparent, rgba(0,0,0,0.7));
      z-index: 10;
    }

    /* ── Social links ── */
    .social-links {
      display: flex;
      gap: 20px;
    }

    .social-link {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border: 1px solid rgba(255,255,255,0.35);
      color: #fff;
      text-decoration: none;
      transition: border-color 0.2s, background 0.2s;
    }

    .social-link:hover {
      border-color: #fff;
      background: rgba(255,255,255,0.1);
    }

    .social-link svg {
      width: 22px;
      height: 22px;
      fill: #fff;
    }
  </style>
</head>
<body>
  <div class="bg">
    <h1>Розклад фестивалю</h1>

    <div class="day-buttons">
      <a href="день1.html" class="day-btn">
        ДЕНЬ 1
        <span>13 ЧЕРВНЯ</span>
      </a>
      <a href="день2.html" class="day-btn">
        ДЕНЬ 2
        <span>14 ЧЕРВНЯ</span>
      </a>
    </div>

    <a href="mapa.jpg" target="_blank" class="day-btn" style="font-size: clamp(0.85em, 3.5vw, 1.1em);">
      МАПА ФЕСТИВАЛЮ
    </a>

    <button class="fav-btn" onclick="openFavs()">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      ОБРАНІ
      <span class="fav-count" id="fav-count"></span>
    </button>
  </div>

  <div class="fav-overlay" id="fav-overlay" onclick="closeFavsIfBg(event)">
    <div class="fav-modal">
      <div class="fav-modal-header">
        <span class="fav-modal-title">Обрані артисти</span>
        <button class="fav-close" onclick="closeFavs()">✕</button>
      </div>
      <div class="fav-list" id="fav-list"></div>
    </div>
  </div>

  <footer>
    <div class="social-links">
      <a href="https://www.instagram.com/brud_pes_brud_fest/" target="_blank" class="social-link" aria-label="Instagram">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
      </a>
      <a href="https://t.me/brydnyiparkan" target="_blank" class="social-link" aria-label="Telegram">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>
      </a>
    </div>
  </footer>

  <script>
    const YEAR = 2026;
    const FAV_KEYS = { 1: `bpbf_fav_${YEAR}_day1`, 2: `bpbf_fav_${YEAR}_day2` };
    const FESTIVAL_DATES = { 1: { month: 6, day: 13 }, 2: { month: 6, day: 14 } };

    function loadAllFavs() {
      const all = [];
      [1, 2].forEach(d => {
        try {
          const items = JSON.parse(localStorage.getItem(FAV_KEYS[d]) || '[]');
          items.forEach(f => {
            if (f && typeof f === 'object' && f.id && f.name) all.push({ ...f, day: d });
          });
        } catch {}
      });
      all.sort((a, b) => a.day - b.day || a.startMin - b.startMin);
      return all;
    }

    function getCountdown(item) {
      const now = new Date();
      const fd = FESTIVAL_DATES[item.day];
      if (now.getMonth() + 1 !== fd.month || now.getDate() !== fd.day || now.getFullYear() !== YEAR) return null;
      const nowMin = now.getHours() * 60 + now.getMinutes();
      const diff = item.startMin - nowMin;
      if (diff <= 0 || diff > 180) return null;
      if (diff < 60) return `через ${diff} хв`;
      const h = Math.floor(diff / 60), m = diff % 60;
      return m > 0 ? `через ${h} год ${m} хв` : `через ${h} год`;
    }

    function updateFavCount() {
      const count = loadAllFavs().length;
      const el = document.getElementById('fav-count');
      el.textContent = count;
      el.classList.toggle('visible', count > 0);
    }

    function renderFavList() {
      const items = loadAllFavs();
      const list = document.getElementById('fav-list');
      if (!items.length) {
        list.innerHTML = '<div class="fav-empty">Ще нічого не обрано.<br>Натисни ♡ на артисті у розкладі.</div>';
        return;
      }
      list.innerHTML = items.map(f => {
        const countdown = getCountdown(f);
        return `<div class="fav-item">
          <div class="fav-item-left">
            <div class="fav-item-name">${f.name}</div>
            <div class="fav-item-meta">${f.stage} · ДЕНЬ ${f.day} · ${f.date}</div>
          </div>
          <div class="fav-item-right">
            <div class="fav-item-time">${f.time}</div>
            ${countdown ? `<div class="fav-item-countdown">${countdown}</div>` : ''}
          </div>
        </div>`;
      }).join('');
    }

    function openFavs() {
      renderFavList();
      document.getElementById('fav-overlay').classList.add('open');
    }
    function closeFavs() {
      document.getElementById('fav-overlay').classList.remove('open');
    }
    function closeFavsIfBg(e) {
      if (e.target === document.getElementById('fav-overlay')) closeFavs();
    }

    document.addEventListener('DOMContentLoaded', updateFavCount);
    window.addEventListener('pageshow', updateFavCount);
    window.addEventListener('focus', updateFavCount);
  </script>
</body>
</html>
